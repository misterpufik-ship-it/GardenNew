<cms:if gallery_tab='interior'>
    <cms:show_repeatable 'gallery_interior_items'>
        <cms:if gallery_img>
            <div class="gallery-slide-item ratio-3-2">
                <img src="<cms:show gallery_img />" loading="lazy" decoding="async" alt="">
            </div>
        </cms:if>
    </cms:show_repeatable>
</cms:if>
