<style>
.garden-row-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 16px;
    margin: 0;
    gap: 0;
    line-height: 0;
}
.garden-row-stack label,
.garden-row-stack .delete-row {
    display: block;
    width: 16px;
    height: 16px;
    margin: 0;
    padding: 0;
    line-height: 0;
}
.garden-row-stack img,
.garden-row-stack .delete-row svg {
    display: block;
    width: 16px;
    height: 16px;
}
.garden-row-tool {
    display: block;
    width: 16px;
    height: 14px;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: #6b4f1d;
    cursor: pointer;
    line-height: 0;
}
.garden-row-tool svg {
    display: block;
    width: 14px;
    height: 14px;
    margin: 0 auto;
}
.garden-row-tool:hover,
.garden-row-tool:focus {
    color: #000;
    outline: none;
}
.mosaic_contents.garden-row-flash,
tr.garden-row-flash td {
    animation: gardenRowFlash 1.1s ease;
}
@keyframes gardenRowFlash {
    from { box-shadow: inset 0 0 0 2px #C5A059; }
    to { box-shadow: inset 0 0 0 0 transparent; }
}
</style>
<script>
(function() {
    var path = window.location.pathname || '';
    if (path.indexOf('/couch/') === -1) {
        return;
    }

    var REPEATABLES = ['rep_hookahs_v2', 'rep_kitchen_v2', 'rep_bar_alc_v2', 'rep_bar_non_v2', 'list_promos_v2', 'menu_shisha', 'menu_kitchen', 'menu_bar'];
    var FIELD_RE = /^f_(rep_[a-z0-9_]+|list_promos_v2|menu_shisha|menu_kitchen|menu_bar)\[(\d+)\]\[([a-z0-9_]+)\]$/i;

    function toast(message, ok) {
        var el = document.getElementById('garden-copy-toast');
        if (!el) {
            el = document.createElement('div');
            el.id = 'garden-copy-toast';
            el.style.cssText = 'position:fixed;right:18px;bottom:18px;z-index:99999;padding:12px 16px;border-radius:4px;color:#fff;font:13px/1.4 sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:320px;';
            document.body.appendChild(el);
        }
        el.style.background = ok ? '#2e7d32' : '#b71c1c';
        el.textContent = message;
        clearTimeout(el._timer);
        el._timer = setTimeout(function() { el.remove(); }, 3500);
    }

    function collectRowData(rowEl) {
        var data = {};
        var repeatable = '';
        rowEl.querySelectorAll('input, select, textarea').forEach(function(input) {
            var name = input.getAttribute('name') || '';
            var match = name.match(FIELD_RE);
            if (!match) {
                return;
            }
            repeatable = match[1];
            var field = match[3];
            if (input.type === 'checkbox' || input.type === 'radio') {
                if (input.checked) {
                    data[field] = input.value;
                }
            } else {
                data[field] = input.value;
            }
        });
        return { repeatable: repeatable, row: data };
    }

    function findRowContainer(input) {
        var node = input;
        while (node && node !== document.body) {
            if (node.tagName === 'TR' && node.parentElement && node.parentElement.tagName === 'TBODY') {
                return node;
            }
            node = node.parentElement;
        }
        return null;
    }

    function fieldKey(name) {
        var match = String(name || '').match(/\[([a-z0-9_]+)\]$/i);
        return match ? match[1] : '';
    }

    function editorOf(textarea) {
        if (!textarea || !textarea.id || !window.nicEditors || !nicEditors.findEditor) {
            return null;
        }
        try {
            return nicEditors.findEditor(textarea.id) || null;
        } catch (err) {
            return null;
        }
    }

    function readFields(rowEl) {
        var data = {};
        rowEl.querySelectorAll('input, select, textarea').forEach(function(input) {
            var key = fieldKey(input.getAttribute('name'));
            if (!key) {
                return;
            }
            if (input.type === 'checkbox' || input.type === 'radio') {
                if (input.checked) {
                    data[key] = input.value;
                }
                return;
            }
            if (input.type === 'file' || input.type === 'button' || input.type === 'submit') {
                return;
            }
            if (input.tagName === 'TEXTAREA') {
                var editor = editorOf(input);
                data[key] = editor && editor.getContent ? editor.getContent() : input.value;
                return;
            }
            data[key] = input.value;
        });
        return data;
    }

    function writeFields(rowEl, data) {
        var pending = [];
        rowEl.querySelectorAll('input, select, textarea').forEach(function(input) {
            var key = fieldKey(input.getAttribute('name'));
            if (!key || !Object.prototype.hasOwnProperty.call(data, key)) {
                return;
            }
            if (input.type === 'checkbox' || input.type === 'radio') {
                input.checked = input.value === data[key];
                return;
            }
            if (input.type === 'file' || input.type === 'button' || input.type === 'submit') {
                return;
            }
            if (input.tagName === 'TEXTAREA') {
                input.value = data[key];
                pending.push(input);
                return;
            }
            input.value = data[key];
            input.dispatchEvent(new Event('change', { bubbles: true }));
        });
        var tries = 0;
        function flushEditors() {
            var left = [];
            pending.forEach(function(textarea) {
                var editor = editorOf(textarea);
                if (editor && editor.setContent) {
                    editor.setContent(textarea.value);
                    return;
                }
                left.push(textarea);
            });
            pending = left;
            if (pending.length && tries < 20) {
                tries += 1;
                setTimeout(flushEditors, 50);
            }
        }
        flushEditors();
    }

    function insertBelow(rowEl) {
        var jq = window.jQuery;
        var table = rowEl.closest('table.rr');
        if (!jq || !table || !table.id) {
            return null;
        }
        var addBtn = document.querySelector('#addRow_' + table.id + ' a');
        if (!addBtn) {
            return null;
        }
        var next = rowEl.nextElementSibling;
        if (next && next.id && !next.classList.contains('noDataRow')) {
            jq(addBtn).trigger('click', [next.id]);
            return next.previousElementSibling;
        }
        jq(addBtn).trigger('click');
        var body = table.tBodies && table.tBodies[0];
        return body && body.rows.length ? body.rows[body.rows.length - 1] : null;
    }

    function flashRow(rowEl) {
        if (!rowEl) {
            return;
        }
        var box = rowEl.querySelector('.mosaic_contents') || rowEl;
        box.classList.remove('garden-row-flash');
        void box.offsetWidth;
        box.classList.add('garden-row-flash');
    }

    function makeCopyButton(onClick) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'garden-row-tool';
        btn.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="5.2" y="1.4" width="9" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="1.6" y="4.6" width="9" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';
        btn.addEventListener('mousedown', function(event) {
            event.stopPropagation();
        });
        btn.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopPropagation();
            onClick();
        });
        return btn;
    }

    function attachRowTools(rowEl) {
        if (!rowEl || rowEl.closest('[id^="addNewRow_"]')) {
            return;
        }
        var actions = rowEl.querySelector('.col-actions') || rowEl.querySelector('td.delete');
        if (!actions || actions.dataset.gardenRowTools === '1') {
            return;
        }
        var sample = actions.closest('tr');
        if (!sample || !sample.querySelector('input[name^="f_rep_"], input[name^="f_list_promos_v2"], input[name^="f_menu_"], select[name^="f_rep_"], select[name^="f_menu_"], textarea[name^="f_rep_"], textarea[name^="f_menu_"]')) {
            return;
        }
        actions.dataset.gardenRowTools = '1';
        var copyBtn = makeCopyButton(function() {
            var data = readFields(rowEl);
            var created = insertBelow(rowEl);
            if (!created) {
                toast('Не удалось добавить копию.', false);
                return;
            }
            writeFields(created, data);
            flashRow(created);
        });
        var del = actions.querySelector('.delete-row') || actions.querySelector('label');
        var stack = document.createElement('div');
        stack.className = 'garden-row-stack';
        if (del) {
            stack.appendChild(del);
        }
        stack.appendChild(copyBtn);
        actions.appendChild(stack);
    }

    function decorateRow(rowEl) {
        if (!rowEl || rowEl.dataset.gardenCopyReady === '1') {
            return;
        }

        var sample = rowEl.querySelector('input[name^="f_rep_"], input[name^="f_list_promos_v2"], input[name^="f_menu_"], select[name^="f_rep_"], select[name^="f_list_promos_v2"], select[name^="f_menu_"], textarea[name^="f_rep_"], textarea[name^="f_list_promos_v2"], textarea[name^="f_menu_"]');
        if (!sample) {
            return;
        }

        var match = (sample.getAttribute('name') || '').match(FIELD_RE);
        if (!match || REPEATABLES.indexOf(match[1]) === -1) {
            return;
        }

        rowEl.dataset.gardenCopyReady = '1';
        attachRowTools(rowEl);
    }

    function scanRepeatables() {
        document.querySelectorAll('input[name^="f_rep_"], input[name^="f_list_promos_v2"], input[name^="f_menu_"], select[name^="f_rep_"], select[name^="f_list_promos_v2"], select[name^="f_menu_"], textarea[name^="f_rep_"], textarea[name^="f_list_promos_v2"], textarea[name^="f_menu_"]').forEach(function(input) {
            var rowEl = findRowContainer(input);
            if (rowEl) {
                decorateRow(rowEl);
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        scanRepeatables();
        var observer = new MutationObserver(function() {
            scanRepeatables();
        });
        observer.observe(document.body, { childList: true, subtree: true });
    });
})();
</script>
