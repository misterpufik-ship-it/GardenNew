<style>
.garden-copy-row-btn-wrap {
    position: absolute;
    top: 6px;
    right: 8px;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s ease;
}
.repeatable-region tbody tr:hover .garden-copy-row-btn-wrap,
.repeatable-region .mosaic_contents:hover .garden-copy-row-btn-wrap {
    opacity: 1;
    pointer-events: auto;
}
.garden-copy-row-btn {
    border: 1px solid #C5A059;
    background: #fff;
    color: #6b4f1d;
    font-size: 11px;
    line-height: 1;
    padding: 5px 8px;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
}
.garden-copy-row-btn:hover {
    background: #C5A059;
    color: #fff;
}
.garden-copy-row-btn[disabled] {
    opacity: .6;
    cursor: wait;
}
#f_rep_hookahs_v2 .col-actions,
#f_rep_kitchen_v2 .col-actions,
#f_rep_bar_alc_v2 .col-actions,
#f_rep_bar_non_v2 .col-actions,
#f_list_promos_v2 .col-actions {
    width: auto !important;
    min-width: 0;
    white-space: nowrap;
    padding-right: 4px;
}
.garden-row-tool {
    display: inline-block;
    width: 18px;
    height: 18px;
    margin: 0 3px 0 0;
    padding: 2px 0;
    border: 0;
    background: transparent;
    color: #666;
    cursor: pointer;
    vertical-align: top;
    line-height: 0;
}
.garden-row-tool svg {
    display: block;
    width: 16px;
    height: 16px;
}
.garden-row-tool:hover,
.garden-row-tool:focus {
    color: #000;
    outline: none;
}
.mosaic_contents.garden-row-flash {
    animation: gardenRowFlash 1.1s ease;
}
@keyframes gardenRowFlash {
    from { box-shadow: inset 0 0 0 2px #C5A059; }
    to { box-shadow: inset 0 0 0 0 transparent; }
}
</style>
<script>
(function() {
    var path = window.location.pathname || '';
    if (path.indexOf('/couch/admin.php') === -1) {
        return;
    }

    var TARGET_BRANCH = '<cms:show branch_copy_to />';
    var TARGET_LABEL = '<cms:show branch_copy_to_label />';
    var API_URL = '/admiralteyskaya/couch/menu-copy-api.php';
    var REPEATABLES = ['rep_hookahs_v2', 'rep_kitchen_v2', 'rep_bar_alc_v2', 'rep_bar_non_v2', 'list_promos_v2'];
    var FIELD_RE = /^f_(rep_[a-z0-9_]+|list_promos_v2)\[(\d+)\]\[([a-z0-9_]+)\]$/i;

    function toast(message, ok) {
        var el = document.getElementById('garden-copy-toast');
        if (!el) {
            el = document.createElement('div');
            el.id = 'garden-copy-toast';
            el.style.cssText = 'position:fixed;right:18px;bottom:18px;z-index:99999;padding:12px 16px;border-radius:4px;color:#fff;font:13px/1.4 sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:320px;';
            document.body.appendChild(el);
        }
        el.style.background = ok ? '#2e7d32' : '#b71c1c';
        el.textContent = message;
        clearTimeout(el._timer);
        el._timer = setTimeout(function() { el.remove(); }, 3500);
    }

    function collectRowData(rowEl) {
        var data = {};
        var repeatable = '';
        rowEl.querySelectorAll('input, select, textarea').forEach(function(input) {
            var name = input.getAttribute('name') || '';
            var match = name.match(FIELD_RE);
            if (!match) {
                return;
            }
            repeatable = match[1];
            var field = match[3];
            if (input.type === 'checkbox' || input.type === 'radio') {
                if (input.checked) {
                    data[field] = input.value;
                }
            } else {
                data[field] = input.value;
            }
        });
        return { repeatable: repeatable, row: data };
    }

    function findRowContainer(input) {
        var node = input;
        while (node && node !== document.body) {
            if (node.tagName === 'TR' && node.parentElement && node.parentElement.tagName === 'TBODY') {
                return node;
            }
            node = node.parentElement;
        }
        return null;
    }

    var COPY_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="5.2" y="1.2" width="9" height="10.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="1.6" y="4.6" width="9" height="10.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';
    var ADD_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2.2 3.2h11.6M2.2 6.4h11.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M8 9.2v5.2M5.4 11.8h5.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';

    function fieldKey(name) {
        var match = String(name || '').match(/\[([a-z0-9_]+)\]$/i);
        return match ? match[1] : '';
    }

    function editorOf(textarea) {
        if (!textarea || !textarea.id || !window.nicEditors || !nicEditors.findEditor) {
            return null;
        }
        try {
            return nicEditors.findEditor(textarea.id) || null;
        } catch (err) {
            return null;
        }
    }

    function readFields(rowEl) {
        var data = {};
        rowEl.querySelectorAll('input, select, textarea').forEach(function(input) {
            var key = fieldKey(input.getAttribute('name'));
            if (!key) {
                return;
            }
            if (input.type === 'checkbox' || input.type === 'radio') {
                if (input.checked) {
                    data[key] = input.value;
                }
                return;
            }
            if (input.type === 'file' || input.type === 'button' || input.type === 'submit') {
                return;
            }
            if (input.tagName === 'TEXTAREA') {
                var editor = editorOf(input);
                data[key] = editor && editor.getContent ? editor.getContent() : input.value;
                return;
            }
            data[key] = input.value;
        });
        return data;
    }

    function writeFields(rowEl, data) {
        var pending = [];
        rowEl.querySelectorAll('input, select, textarea').forEach(function(input) {
            var key = fieldKey(input.getAttribute('name'));
            if (!key || !Object.prototype.hasOwnProperty.call(data, key)) {
                return;
            }
            if (input.type === 'checkbox' || input.type === 'radio') {
                input.checked = input.value === data[key];
                return;
            }
            if (input.type === 'file' || input.type === 'button' || input.type === 'submit') {
                return;
            }
            if (input.tagName === 'TEXTAREA') {
                input.value = data[key];
                pending.push(input);
                return;
            }
            input.value = data[key];
            input.dispatchEvent(new Event('change', { bubbles: true }));
        });
        var tries = 0;
        function flushEditors() {
            var left = [];
            pending.forEach(function(textarea) {
                var editor = editorOf(textarea);
                if (editor && editor.setContent) {
                    editor.setContent(textarea.value);
                    return;
                }
                left.push(textarea);
            });
            pending = left;
            if (pending.length && tries < 20) {
                tries += 1;
                setTimeout(flushEditors, 50);
            }
        }
        flushEditors();
    }

    function insertBelow(rowEl) {
        var jq = window.jQuery;
        var table = rowEl.closest('table.rr');
        if (!jq || !table || !table.id) {
            return null;
        }
        var addBtn = document.querySelector('#addRow_' + table.id + ' a');
        if (!addBtn) {
            return null;
        }
        var next = rowEl.nextElementSibling;
        if (next && next.id && !next.classList.contains('noDataRow')) {
            jq(addBtn).trigger('click', [next.id]);
            return next.previousElementSibling;
        }
        jq(addBtn).trigger('click');
        var body = table.tBodies && table.tBodies[0];
        return body && body.rows.length ? body.rows[body.rows.length - 1] : null;
    }

    function flashRow(rowEl) {
        if (!rowEl) {
            return;
        }
        var box = rowEl.querySelector('.mosaic_contents') || rowEl;
        box.classList.remove('garden-row-flash');
        void box.offsetWidth;
        box.classList.add('garden-row-flash');
    }

    function makeTool(label, svg, onClick) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'garden-row-tool icon';
        btn.title = label;
        btn.setAttribute('aria-label', label);
        btn.innerHTML = svg;
        btn.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopPropagation();
            onClick();
        });
        return btn;
    }

    function attachRowTools(rowEl) {
        if (!rowEl || rowEl.closest('[id^="addNewRow_"]')) {
            return;
        }
        var actions = rowEl.querySelector('.col-actions');
        if (!actions || actions.dataset.gardenRowTools === '1') {
            return;
        }
        var sample = actions.closest('tr');
        if (!sample || !sample.querySelector('input[name^="f_rep_"], input[name^="f_list_promos_v2"], select[name^="f_rep_"], textarea[name^="f_rep_"]')) {
            return;
        }
        actions.dataset.gardenRowTools = '1';
        var copyBtn = makeTool('Копировать позицию', COPY_ICON, function() {
            var data = readFields(rowEl);
            var created = insertBelow(rowEl);
            if (!created) {
                toast('Не удалось добавить копию.', false);
                return;
            }
            writeFields(created, data);
            flashRow(created);
        });
        var addBtn = makeTool('Добавить пустую позицию ниже', ADD_ICON, function() {
            var created = insertBelow(rowEl);
            if (!created) {
                toast('Не удалось добавить позицию.', false);
                return;
            }
            flashRow(created);
        });
        var del = actions.querySelector('.delete-row');
        if (del) {
            actions.insertBefore(addBtn, del);
            actions.insertBefore(copyBtn, addBtn);
        } else {
            actions.appendChild(copyBtn);
            actions.appendChild(addBtn);
        }
    }

    function decorateRow(rowEl) {
        if (!rowEl || rowEl.dataset.gardenCopyReady === '1') {
            return;
        }

        var sample = rowEl.querySelector('input[name^="f_rep_"], input[name^="f_list_promos_v2"], select[name^="f_rep_"], select[name^="f_list_promos_v2"], textarea[name^="f_rep_"], textarea[name^="f_list_promos_v2"]');
        if (!sample) {
            return;
        }

        var match = (sample.getAttribute('name') || '').match(FIELD_RE);
        if (!match || REPEATABLES.indexOf(match[1]) === -1) {
            return;
        }

        rowEl.dataset.gardenCopyReady = '1';

        var anchor = rowEl.querySelector('.mosaic_contents') || rowEl.querySelector('.col-contents') || rowEl;
        if (getComputedStyle(anchor).position === 'static') {
            anchor.style.position = 'relative';
        }

        var wrap = document.createElement('div');
        wrap.className = 'garden-copy-row-btn-wrap';
        wrap.title = 'Копировать во второй филиал (' + TARGET_LABEL + ')';

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'garden-copy-row-btn';
        btn.textContent = 'Копировать в ' + TARGET_LABEL;
        btn.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopPropagation();

            var payload = collectRowData(rowEl);
            if (!payload.repeatable || !Object.keys(payload.row).length) {
                toast('Не удалось собрать данные строки.', false);
                return;
            }

            btn.disabled = true;
            fetch(API_URL, {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    target_branch: TARGET_BRANCH,
                    repeatable: payload.repeatable,
                    row: payload.row
                })
            })
            .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
            .then(function(result) {
                if (!result.ok || !result.data.ok) {
                    throw new Error((result.data && result.data.error) || 'Copy failed');
                }
                toast(result.data.message || 'Скопировано.', true);
            })
            .catch(function(err) {
                toast(err.message || 'Ошибка копирования.', false);
            })
            .finally(function() {
                btn.disabled = false;
            });
        });

        wrap.appendChild(btn);
        anchor.appendChild(wrap);
        attachRowTools(rowEl);
    }

    function scanRepeatables() {
        document.querySelectorAll('input[name^="f_rep_"], input[name^="f_list_promos_v2"], select[name^="f_rep_"], select[name^="f_list_promos_v2"], textarea[name^="f_rep_"], textarea[name^="f_list_promos_v2"]').forEach(function(input) {
            var rowEl = findRowContainer(input);
            if (rowEl) {
                decorateRow(rowEl);
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        scanRepeatables();
        var observer = new MutationObserver(function() {
            scanRepeatables();
        });
        observer.observe(document.body, { childList: true, subtree: true });
    });
})();
</script>
